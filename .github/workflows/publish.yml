name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for trusted publishing (OIDC); can be removed if using API token.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Install runtime deps for build
        env:
          # astartool lives on the internal index; the package version is read
          # from ``snowland_fastapihelper.__init__``, which imports fastapi /
          # astartool at top level. Building without isolation needs them present.
          PIP_EXTRA_INDEX_URL: ${{ secrets.PIP_EXTRA_INDEX_URL }}
        run: |
          pip install fastapi starlette astartool

      - name: Build distributions
        run: |
          python -m build --no-isolation

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses OIDC trusted publishing by default. To use a token instead,
          # set a PYPI_API_TOKEN secret and pass password: ${{ secrets.PYPI_API_TOKEN }}.
          packages-dir: dist/
