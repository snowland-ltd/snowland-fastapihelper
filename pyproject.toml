[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowland-fastapihelper"
version = "0.1.0"
description = "FastAPI development helper: unified response, pagination, exception handlers and SQLAlchemy model/CRUD helpers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD 3-Clause" }
authors = [{ name = "A.Star" }]
keywords = ["fastapi", "sqlalchemy", "response", "helper", "snowland"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastapi>=0.100",
    "starlette>=0.27",
    "astartool",
]

[project.urls]
Homepage = "https://github.com/snowland-ltd/snowland-fastapihelper"
Repository = "https://github.com/snowland-ltd/snowland-fastapihelper"

[project.optional-dependencies]
# Database-related (SQLAlchemy models / CRUD) are optional; the core features work
# without them (unified response, exception handlers, app factory).
# Note: this library binds to no specific DB driver; it depends only on sqlalchemy
# itself. Install the matching async driver (aiosqlite / asyncpg / aiomysql / ...)
# per your actual database.
sqlalchemy = [
    "sqlalchemy>=2.0",
]
dev = [
    "uvicorn>=0.23",
]

[tool.setuptools.packages.find]
include = ["snowland_fastapihelper*"]
